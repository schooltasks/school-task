<body>
<div id="app">Загрузка...</div>
<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzLFS58EJ2FkAofaTWjrOnRZUSgC5c4JuS0P-HKmVSaL5FTa0ZRA6BG1GvpEw8u1iYd/exec';
let currentUser = null, currentTab = 'allTasks', isDark = localStorage.getItem('dark') === 'true';
let allUsers = [], allTasks = [], allReviews = [], chatMessages = {};
let updateInterval = null, chatPollInterval = null, activeChatTaskId = null, activeChatRecipient = null;
if (isDark) document.body.classList.add('dark');

function playSound(type) {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        if (type === 'success') { osc.frequency.value = 800; gain.gain.value = 0.1; osc.start(); gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.3); osc.stop(ctx.currentTime + 0.3); }
        else if (type === 'error') { osc.frequency.value = 200; gain.gain.value = 0.1; osc.start(); gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.5); osc.stop(ctx.currentTime + 0.5); }
        else if (type === 'click') { osc.frequency.value = 600; gain.gain.value = 0.05; osc.start(); gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.1); osc.stop(ctx.currentTime + 0.1); }
        else if (type === 'message') { osc.frequency.value = 1000; gain.gain.value = 0.08; osc.start(); gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.15); osc.stop(ctx.currentTime + 0.15); }
    } catch(e) {}
}

function showToast(msg, isError) {
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
    if (isError) t.style.background = 'linear-gradient(135deg, #dc2626, #991b1b)';
    document.body.appendChild(t); setTimeout(() => t.remove(), 3000);
    playSound(isError ? 'error' : 'success');
}

function showModal(title, message) {
    const modal = document.createElement('div'); modal.className = 'modal show';
    modal.innerHTML = `<div class="modal-content"><h3 style="color:#1a73e8;margin-bottom:15px;">${title}</h3><p style="line-height:1.6;color:#475569;">${message}</p><button class="btn-danger" style="margin-top:20px;width:100%;">Закрыть</button></div>`;
    document.body.appendChild(modal);
    modal.querySelector('button').onclick = () => modal.remove();
    modal.onclick = e => { if (e.target === modal) modal.remove(); };
}

function showWalletModal() {
    const modal = document.createElement('div'); modal.className = 'modal show';
    modal.innerHTML = `
        <div class="modal-content">
            <h3 style="color:#1a73e8;margin-bottom:15px;">💰 Управление кошельком</h3>
            <p style="font-size:1.1rem;"><strong>Основной баланс:</strong> ${(parseFloat(currentUser.balance)||0).toFixed(2)} ₽</p>
            <p style="font-size:1.1rem;"><strong>Бонусный баланс:</strong> ${(parseFloat(currentUser.bonus_balance)||0).toFixed(2)} ₽</p>
            <div style="background:#fef3c7;padding:12px;border-radius:16px;margin:15px 0;font-size:0.85rem;text-align:center;">💱 Курс: 1 рубль реальный = 0.9 ₽ на балансе сайта (комиссия платформы 10%)</div>
            <div style="display:flex;gap:10px;">
                <button class="btn-primary" id="md" style="flex:1;">💰 Пополнить</button>
                <button class="btn-warning" id="mw" style="flex:1;">💸 Вывести</button>
            </div>
            <button class="btn-danger" style="margin-top:15px;width:100%;">Закрыть</button>
        </div>`;
    document.body.appendChild(modal);
    modal.querySelector('#md').onclick = () => { modal.remove(); showModal('💰 Пополнение баланса', 'Все пополнения средств производятся только через поддержку.<br><br>Напишите <strong>@leshr_ak47</strong> в Telegram, укажите сумму пополнения и ваш ID.'); };
    modal.querySelector('#mw').onclick = () => { modal.remove(); showModal('💸 Вывод средств', 'Все выводы средств производятся только через поддержку.<br><br>Напишите <strong>@leshr_ak47</strong> в Telegram, укажите сумму вывода и реквизиты.'); };
    modal.querySelector('.btn-danger').onclick = () => modal.remove();
    modal.onclick = e => { if (e.target === modal) modal.remove(); };
}

function escapeHtml(s) { return s ? String(s).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])) : ''; }

async function callAPI(action, params = {}) {
    try {
        const url = new URL(SCRIPT_URL);
        url.searchParams.append('action', action);
        Object.keys(params).forEach(k => url.searchParams.append(k, params[k]));
        const r = await fetch(url.toString(), { signal: AbortSignal.timeout(8000), cache: 'no-cache' });
        const t = await r.text();
        try { return JSON.parse(t); } catch(e) { return null; }
    } catch(e) { return null; }
}

async function loadAllData() {
    const [u, t, rv] = await Promise.all([callAPI('getUsers'), callAPI('getTasks'), callAPI('getReviews')]);
    if (u && !u.error) allUsers = Array.isArray(u) ? u : (u.users || []);
    if (t && !t.error) {
        allTasks = Array.isArray(t) ? t : (t.tasks || []);
        allTasks.forEach(task => {
            if (task.chatMessages) { try { chatMessages[task.id] = JSON.parse(task.chatMessages); } catch(e) { chatMessages[task.id] = []; } }
            else if (!chatMessages[task.id]) chatMessages[task.id] = [];
        });
    }
    if (rv && !rv.error) allReviews = Array.isArray(rv) ? rv : (rv.reviews || []);
    if (currentUser) {
        const me = allUsers.find(u => u.id === currentUser.id);
        if (me) { currentUser.balance = me.balance; currentUser.bonus_balance = me.bonus_balance; currentUser.tasksCompleted = me.tasksCompleted; currentUser.blackMarks = me.blackMarks; }
    }
    updateUI();
}

function updateUI() {
    const bc = document.getElementById('balanceCard'), bnc = document.getElementById('bonusCard');
    if (bc) bc.textContent = `💰 ${(parseFloat(currentUser?.balance)||0).toFixed(2)} ₽`;
    if (bnc) bnc.textContent = `🎁 ${(parseFloat(currentUser?.bonus_balance)||0).toFixed(2)} ₽`;
}

function startAutoUpdate() {
    if (updateInterval) clearInterval(updateInterval);
    if (chatPollInterval) clearInterval(chatPollInterval);
    updateInterval = setInterval(loadAllData, 3000);
    chatPollInterval = setInterval(pollChat, 1500);
}

async function pollChat() {
    if (!activeChatTaskId || !currentUser) return;
    const t = await callAPI('getTasks');
    if (t && !t.error) {
        const tasks = Array.isArray(t) ? t : (t.tasks || []);
        const task = tasks.find(x => x.id === activeChatTaskId);
        if (task && task.chatMessages) {
            try {
                const msgs = JSON.parse(task.chatMessages);
                if (JSON.stringify(msgs) !== JSON.stringify(chatMessages[activeChatTaskId])) {
                    chatMessages[activeChatTaskId] = msgs;
                    const container = document.getElementById('chatMessages');
                    if (container) updateChatDisplay();
                }
            } catch(e) {}
        }
    }
}

function openChat(taskId, recipientId) {
    activeChatTaskId = taskId;
    activeChatRecipient = recipientId;
    if (!chatMessages[taskId]) chatMessages[taskId] = [];
    const existing = document.querySelector('.chat-modal');
    if (existing) existing.remove();
    const recipient = allUsers.find(u => u.id === recipientId);
    const task = allTasks.find(t => t.id === taskId);
    const modal = document.createElement('div'); modal.className = 'chat-modal show';
    modal.innerHTML = `
        <div class="chat-content">
            <div class="chat-header">
                <div><strong>💬 Чат по заданию</strong><br><small style="opacity:0.7;">${escapeHtml(recipient?.name||'Пользователь')} • ${escapeHtml(task?.description?.substring(0,30)||'Задание')}...</small></div>
                <button class="btn-danger" id="ccb" style="padding:8px 14px;">✕ Закрыть</button>
            </div>
            <div class="chat-messages" id="chatMessages"></div>
            <div class="chat-input-container">
                <input type="text" id="ci" placeholder="Введите сообщение..." maxlength="500">
                <button class="btn-primary" id="csb" style="padding:12px 20px;">➤ Отправить</button>
            </div>
        </div>`;
    document.body.appendChild(modal);
    modal.querySelector('#ccb').onclick = () => { modal.remove(); activeChatTaskId = null; };
    modal.querySelector('#csb').onclick = sendChat;
    modal.querySelector('#ci').onkeypress = e => { if (e.key === 'Enter') sendChat(); };
    updateChatDisplay();
}

function updateChatDisplay() {
    const container = document.getElementById('chatMessages');
    if (!container) return;
    const msgs = chatMessages[activeChatTaskId] || [];
    container.innerHTML = msgs.length ? msgs.map(m => {
        const isMine = m.senderId === currentUser.id;
        const sender = allUsers.find(u => u.id === m.senderId);
        return `<div class="chat-message ${isMine?'mine':'other'}"><div>${escapeHtml(m.text)}</div><div class="chat-message-time">${escapeHtml(sender?.name||'?')} • ${new Date(m.createdAt).toLocaleTimeString()}</div></div>`;
    }).join('') : '<div style="text-align:center;color:#888;padding:30px;">💬 Нет сообщений. Начните общение!</div>';
    container.scrollTop = container.scrollHeight;
}

async function sendChat() {
    const input = document.getElementById('ci');
    if (!input || !input.value.trim()) return;
    const text = input.value.trim(); input.value = '';
    chatMessages[activeChatTaskId].push({ senderId: currentUser.id, text, createdAt: new Date().toISOString() });
    const result = await callAPI('updateTask', { id: activeChatTaskId, chatMessages: JSON.stringify(chatMessages[activeChatTaskId]) });
    if (result && result.success) { playSound('message'); updateChatDisplay(); }
    else { showToast('❌ Ошибка отправки сообщения', true); chatMessages[activeChatTaskId].pop(); }
}

async function register(name, school, corp, password, ref, btn) {
    if (!name || name.length < 3 || !/^[a-zA-Zа-яА-Я0-9_]+$/.test(name)) { showToast('❌ Имя должно быть 3-10 символов (буквы, цифры, _)', true); if(btn) {btn.disabled=false; btn.textContent='📝 Зарегистрироваться';} return; }
    if (!school || !/^\d+$/.test(school) || !corp || !/^\d+$/.test(corp)) { showToast('❌ Школа и корпус — только цифры', true); if(btn) {btn.disabled=false; btn.textContent='📝 Зарегистрироваться';} return; }
    if (!password || password.length < 3) { showToast('❌ Пароль минимум 3 символа', true); if(btn) {btn.disabled=false; btn.textContent='📝 Зарегистрироваться';} return; }
    if (btn) { btn.disabled = true; btn.textContent = '⏳ Регистрация...'; }
    const result = await callAPI('registerUser', {
        id: 'u' + Date.now(), name, school, corp, password,
        referral_code: name + '_' + Math.random().toString(36).substr(2,4).toUpperCase(),
        referred_by: ref || '', registeredAt: new Date().toISOString(), blackMarks: 0
    });
    if (result && result.success) { showToast('✅ Регистрация успешна! Теперь войдите'); await loadAllData(); document.getElementById('tabLogin').click(); }
    else showToast('❌ ' + (result?.error || 'Ошибка регистрации'), true);
    if (btn) { btn.disabled = false; btn.textContent = '📝 Зарегистрироваться'; }
}

async function login(name, school, corp, password, btn) {
    if (!name || !school || !corp || !password) { showToast('❌ Заполните все поля', true); if(btn) {btn.disabled=false; btn.textContent='🔐 Войти';} return; }
    if (btn) { btn.disabled = true; btn.textContent = '⏳ Вход...'; }
    
    // Загружаем данные и ждём
    await loadAllData();
    
    // Ищем пользователя
    const user = allUsers.find(u => 
        String(u.name).toLowerCase() === String(name).toLowerCase().trim() && 
        String(u.school) === String(school).trim() && 
        String(u.corp) === String(corp).trim()
    );
    
    if (!user) { 
        showToast('❌ Пользователь не найден. Проверьте имя, школу и корпус', true); 
        if(btn) {btn.disabled=false; btn.textContent='🔐 Войти';} 
        return; 
    }
    if ((parseInt(user.blackMarks)||0) >= 3) { 
        showToast('❌ АККАУНТ ЗАБЛОКИРОВАН НАВСЕГДА! Причина: 3 чёрные метки', true); 
        if(btn) {btn.disabled=false; btn.textContent='🔐 Войти';} 
        return; 
    }
    if (String(user.password) !== String(password)) { 
        showToast('❌ Неверный пароль', true); 
        if(btn) {btn.disabled=false; btn.textContent='🔐 Войти';} 
        return; 
    }
    
    currentUser = JSON.parse(JSON.stringify(user));
    localStorage.setItem('schooltask_user', JSON.stringify({ id: currentUser.id, name: currentUser.name }));
    showToast(`✅ Добро пожаловать, ${user.name}!`);
    if (btn) { btn.disabled = false; btn.textContent = '🔐 Войти'; }
    startAutoUpdate();
    renderMain();
}

async function createTask(desc, price, location, paymentType, btn) {
    if (!desc || !price || !location) { showToast('❌ Заполните все поля: описание, цена, место', true); if(btn) btn.disabled = false; return; }
    const p = parseFloat(price);
    if (isNaN(p) || p <= 0) { showToast('❌ Цена должна быть больше 0', true); if(btn) btn.disabled = false; return; }
    const currentBalance = paymentType === 'bonus' ? parseFloat(currentUser.bonus_balance)||0 : parseFloat(currentUser.balance)||0;
    if (currentBalance < p) { showToast('❌ Недостаточно средств на балансе', true); if(btn) btn.disabled = false; return; }
    if (paymentType === 'bonus') currentUser.bonus_balance = (currentBalance - p).toFixed(2);
    else currentUser.balance = (currentBalance - p).toFixed(2);
    updateUI();
    const updateResult = await callAPI('updateUser', { id: currentUser.id, balance: currentUser.balance, bonus_balance: currentUser.bonus_balance });
    if (!updateResult || updateResult.error) { showToast('❌ Ошибка обновления баланса', true); await loadAllData(); if(btn) btn.disabled = false; return; }
    const taskId = 'task_' + Date.now();
    const result = await callAPI('createTask', { id: taskId, creatorId: currentUser.id, description: desc, price: p, location, payment_type: paymentType, createdAt: new Date().toISOString() });
    if (result && result.success) {
        showToast(`✅ Задание создано! С баланса списано ${p.toFixed(2)} ₽`);
        await loadAllData();
        if(btn) btn.disabled = false;
        renderMain();
    } else {
        if (paymentType === 'bonus') currentUser.bonus_balance = currentBalance.toFixed(2);
        else currentUser.balance = currentBalance.toFixed(2);
        await callAPI('updateUser', { id: currentUser.id, balance: currentUser.balance, bonus_balance: currentUser.bonus_balance });
        showToast('❌ Ошибка создания задания', true);
        if(btn) btn.disabled = false;
        await loadAllData();
    }
}

async function takeTask(taskId, btn) {
    if (btn) btn.disabled = true;

async function completeTask(taskId, btn) {
    if (btn) btn.disabled = true;
    const r = await callAPI('updateTask', { id: taskId, status: 'awaiting_confirmation' });
    if (r && r.success) { showToast('✅ Задание отмечено как выполненное! Ожидайте подтверждения'); await loadAllData(); renderMain(); }
    else { showToast('❌ Ошибка', true); if(btn) btn.disabled = false; }
}

async function confirmTask(taskId, price, executorId, btn) {
    if (btn) btn.disabled = true;
    const gain = parseFloat(price) * 0.95;
    const exec = allUsers.find(u => u.id === executorId);
    if (exec) await callAPI('updateUser', { id: executorId, balance: ((parseFloat(exec.balance)||0) + gain).toFixed(2), tasksCompleted: (parseInt(exec.tasksCompleted)+1).toString() });
    const r = await callAPI('updateTask', { id: taskId, status: 'completed' });
    if (r && r.success) { showToast(`💰 Задание подтверждено! Исполнитель получил +${gain.toFixed(2)} ₽`); await loadAllData(); renderMain(); }
    else { showToast('❌ Ошибка подтверждения', true); if(btn) btn.disabled = false; }
}

async function disputeTask(taskId, price, executorId, btn) {
    if (btn) btn.disabled = true;
    const exec = allUsers.find(u => u.id === executorId);
    if (exec) await callAPI('updateUser', { id: executorId, blackMarks: (parseInt(exec.blackMarks)+1).toString() });
    const task = allTasks.find(t => t.id === taskId);
    if (task && task.payment_type === 'bonus') currentUser.bonus_balance = ((parseFloat(currentUser.bonus_balance)||0) + parseFloat(price)).toFixed(2);
    else currentUser.balance = ((parseFloat(currentUser.balance)||0) + parseFloat(price)).toFixed(2);
    await callAPI('updateUser', { id: currentUser.id, balance: currentUser.balance, bonus_balance: currentUser.bonus_balance });
    const r = await callAPI('updateTask', { id: taskId, status: 'disputed' });
    if (r && r.success) { showToast(`⚠️ Жалоба принята! Исполнитель получил чёрную метку. Средства возвращены`); await loadAllData(); renderMain(); }
    else { showToast('❌ Ошибка', true); if(btn) btn.disabled = false; }
}

}

function getStatusText(s) {
    const m = { open: ['📋 Доступно','status-open'], in_progress: ['⏳ Выполняется','status-in_progress'], awaiting_confirmation: ['🕐 Ожидает подтверждения','status-awaiting_confirmation'], completed: ['✅ Выполнено','status-completed'], disputed: ['⚠️ Спорное','status-disputed'] };
    return { text: m[s]?.[0]||s, class: m[s]?.[1]||'' };
}

function getUserRank(user) {
    const c = parseInt(user?.tasksCompleted) || 0;
    if(c >= 200) return { emoji: '👑', name: 'Легенда' };
    if(c >= 100) return { emoji: '💎', name: 'Мастер' };
    if(c >= 50) return { emoji: '⭐', name: 'Продвинутый' };
    if(c >= 20) return { emoji: '📌', name: 'Опытный' };
    if(c >= 10) return { emoji: '🌱', name: 'Ученик' };
    return { emoji: '🐣', name: 'Новичок' };
}

function getTop3() {
    return [...allUsers].filter(u => (parseInt(u.tasksCompleted)||0) > 0).sort((a, b) => (parseInt(b.tasksCompleted)||0) - (parseInt(a.tasksCompleted)||0)).slice(0, 3);
}

        c = `<h3 style="margin-bottom:15px;">✅ Завершённые задания</h3><div class="tasks-grid">${tasks.length ? tasks.map(t => `<div class="task-card"><div class="task-header"><div class="task-price">${parseFloat(t.price).toFixed(2)} ₽</div><div class="task-status status-completed">✅ Выполнено</div></div><div class="task-info"><strong>📌 Описание:</strong> ${escapeHtml(t.description)}</div><div class="task-info"><strong>📍 Место:</strong> ${escapeHtml(t.location)}</div></div>`).join('') : '<div style="text-align:center;padding:40px;color:#888;">✨ Нет завершённых заданий</div>'}</div>`;
    } else if (currentTab === 'profile') {
        c = `<div class="card profile-card"><h3 style="margin-bottom:15px;">👤 Мой профиль</h3><p><strong>Имя:</strong> ${escapeHtml(currentUser.name)}</p><p><strong>Школа / Корпус:</strong> ${currentUser.school} / ${currentUser.corp}</p><p><strong>💰 Основной баланс:</strong> ${(parseFloat(currentUser.balance)||0).toFixed(2)} ₽</p><p><strong>🎁 Бонусный баланс:</strong> ${(parseFloat(currentUser.bonus_balance)||0).toFixed(2)} ₽</p><p><strong>📊 Выполнено заданий:</strong> ${parseInt(currentUser.tasksCompleted)||0}</p><p><strong>🏆 Звание:</strong> <span class="rank-badge">${rank.emoji} ${rank.name}</span></p><div class="progress-container"><div class="progress-fill" style="width:${progress}%"></div></div><p style="font-size:0.8rem;color:#888;">Прогресс до следующего звания: ${Math.min(100, progress).toFixed(0)}%</p><div class="referral-code" onclick="navigator.clipboard.writeText('${currentUser.referral_code||''}'); showToast('✅ Реферальный код скопирован!')">🔗 Ваш реферальный код: <strong>${currentUser.referral_code||'Не указан'}</strong> (нажмите чтобы скопировать)</div></div>`;
    } else if (currentTab === 'create') {
        c = `<div class="card"><h3 style="margin-bottom:15px;">📝 Создать новое задание</h3><textarea id="td" rows="3" placeholder="Опишите что нужно сделать..."></textarea><input type="number" id="tp" placeholder="Цена за выполнение (в ₽)"><input id="tl" placeholder="Место выполнения (например: 3 этаж, кабинет 305)"><select id="pt"><option value="main">💰 Списать с основного баланса (${(parseFloat(currentUser.balance)||0).toFixed(2)} ₽)</option><option value="bonus">🎁 Списать с бонусного баланса (${(parseFloat(currentUser.bonus_balance)||0).toFixed(2)} ₽)</option></select><button class="btn-primary" id="cb" style="width:100%;">📝 Создать задание</button></div>`;
    }
    document.getElementById('app').innerHTML = `
        <div class="container">
            <div class="header">
                <div class="logo"><h1>🏫 SchoolTask</h1><span>Биржа школьных поручений</span></div>
                <div class="user-info">
                    <div style="font-weight:600;">👋 ${escapeHtml(currentUser.name)} | 🏫 ${currentUser.school}</div>
                    <div class="balance-card" id="balanceCard">💰 ${(parseFloat(currentUser.balance)||0).toFixed(2)} ₽</div>
                    <div class="bonus-card" id="bonusCard">🎁 ${(parseFloat(currentUser.bonus_balance)||0).toFixed(2)} ₽</div>
                    <button class="theme-toggle" onclick="toggleTheme()">${isDark?'☀️ Светлая':'🌙 Тёмная'}</button>
                    <button class="btn-danger" onclick="logout()">🚪 Выйти</button>
                </div>
            </div>
            <div class="honor-board">
                <h3>🏅 Доска почёта (топ исполнителей)</h3>
                <div class="honor-list">
                    ${top3.length ? top3.map((u, i) => `
                        <div class="honor-item">
                            <span class="honor-medal">${i===0?'🥇':i===1?'🥈':'🥉'}</span>
                            <div class="honor-name">${escapeHtml(u.name)}</div>
                            <div class="honor-count">✅ ${parseInt(u.tasksCompleted)||0} заданий</div>
                        </div>
                    `).join('') : '<div style="color:#888;">Пока нет данных</div>'}
                </div>
            </div>
            <div class="tabs">
                <div class="tab ${currentTab==='allTasks'?'active':''}" data-tab="allTasks">📋 Все задания</div>
                <div class="tab ${currentTab==='myTasks'?'active':''}" data-tab="myTasks">📦 Мои задания</div>
                <div class="tab ${currentTab==='myWork'?'active':''}" data-tab="myWork">⚡ В работе</div>
                <div class="tab ${currentTab==='awaiting'?'active':''}" data-tab="awaiting">🕐 Ожидают</div>
                <div class="tab ${currentTab==='completed'?'active':''}" data-tab="completed">✅ Завершённые</div>
                <div class="tab ${currentTab==='profile'?'active':''}" data-tab="profile">👤 Профиль</div>
                <div class="tab ${currentTab==='create'?'active':''}" data-tab="create">➕ Создать</div>
            </div>
            ${c}
            <div class="support-link">📞 Поддержка: <strong>@leshr_ak47</strong> | 💱 1₽ = 0.9₽ на сайте | ⚫ 3 чёрные метки = блокировка</div>
            <div class="commission-table">
                💰 <strong>Комиссия на пополнения и выводы 10%</strong><br>
                Пиши в Telegram: <a href="https://t.me/leshr_ak47" target="_blank">@Leshr_ak47</a>
            </div>
        </div>`;
    document.getElementById('balanceCard').onclick = () => showWalletModal();
    document.getElementById('bonusCard').onclick = () => showModal('🎁 Бонусный счёт', 'Бонусный счёт используется для создания заданий и получения наград.<br><br>⚠️ Бонусы нельзя вывести на реальные деньги.<br><br>Для вывода доступен только основной баланс.');
    document.querySelectorAll('[data-tab]').forEach(t => t.onclick = function() { playSound('click'); currentTab = this.dataset.tab; renderMain(); });
    if (currentTab === 'create') document.getElementById('cb').onclick = async () => { const btn = document.getElementById('cb'); btn.disabled = true; btn.textContent = '⏳ Создание...'; await createTask(document.getElementById('td').value, document.getElementById('tp').value, document.getElementById('tl').value, document.getElementById('pt').value, btn); };
    document.querySelectorAll('.take-btn').forEach(b => b.onclick = () => takeTask(b.dataset.id, b));
    document.querySelectorAll('.del-btn').forEach(b => b.onclick = () => deleteTask(b.dataset.id, b));
    document.querySelectorAll('.comp-btn').forEach(b => b.onclick = () => completeTask(b.dataset.id, b));
    document.querySelectorAll('.conf-btn').forEach(b => b.onclick = () => confirmTask(b.dataset.id, parseFloat(b.dataset.p), b.dataset.e, b));
    document.querySelectorAll('.dispute-btn').forEach(b => b.onclick = () => disputeTask(b.dataset.id, parseFloat(b.dataset.p), b.dataset.e, b));
    document.querySelectorAll('.chat-btn').forEach(b => b.onclick = () => openChat(b.dataset.id, b.dataset.r));
}

(async function() {
    const saved = localStorage.getItem('schooltask_user');
    if (saved) {
        try {
            const ses = JSON.parse(saved);
            await loadAllData();
            const user = allUsers.find(u => u.id === ses.id);
            if (user && (parseInt(user.blackMarks)||0) < 3) {
                currentUser = JSON.parse(JSON.stringify(user));
                renderMain();
                startAutoUpdate();
                return;
            }
        } catch(e) {}
    }
    renderAuth();
})();
</script>
</body>
